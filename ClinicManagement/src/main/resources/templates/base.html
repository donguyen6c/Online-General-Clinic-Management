<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <th:block th:fragment="css">
        <meta charset="UTF-8">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
              rel="stylesheet"
              integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
              crossorigin="anonymous">
    </th:block>
</head>
<body>

<nav th:fragment="header" class="navbar navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <span class="navbar-brand fw-bold">Phòng Khám Đa Khoa</span>
        <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-3">
            <span class="text-white-50 small" sec:authentication="name"></span>
            <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Đăng xuất</a>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="mt-5 py-3 bg-light border-top">
    <div class="container text-center text-muted small">
        Thống kê báo cáo phòng khám đa khoa &copy; 2026
    </div>
</footer>

</body>
</html>
